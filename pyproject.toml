[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "q-data-foundation"
version = "0.1.0"
description = "Offline Phase 2A data foundation; provider mappings unconfirmed"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.package-data]
qfoundation = ["migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["qfoundation*"]
